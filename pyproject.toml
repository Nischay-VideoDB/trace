[project]
name = "trace-cli"
version = "0.1.0"
description = "Watch coding session, index via VideoDB, generate narrated PR video, answer reviewer Q&A from session memory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "videodb>=0.4.5",
    "typer>=0.16",
    "pydantic>=2.9",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "PyGithub>=2.5",
    "jinja2>=3.1",
    "inotify-simple>=1.3.5",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "hypothesis>=6.115",
]

[project.scripts]
trace = "trace_cli.cli:app"

[project.optional-dependencies]
macos = [
    "videodb[capture]>=0.4.5",
    "watchdog>=4.0",
]
windows = [
    "videodb[capture]>=0.4.5",
    "watchdog>=4.0",
    "pywin32>=306",
    "psutil>=6.0",
]

[tool.uv.sources]
videodb = { git = "https://github.com/video-db/videodb-python.git", rev = "hackathon" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trace_cli"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property", "tests/integration"]
markers = [
    "integration: opt-in tests that hit real external services",
]
addopts = "-m 'not integration' --tb=short"
asyncio_mode = "auto"
